name: Storybook

# Builds the design-system Storybook and publishes it to GitHub Pages.
# The site is public even though this repository is private — that is the point
# of it (an external-facing reference), but keep it in mind before adding
# anything internal to a story.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # @w-industries-luke/core-themes comes from GitHub Packages
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@w-industries-luke'

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cheap guard: never publish a Storybook for a library whose own tests fail.
      - name: Test
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
