name: peer-deps

# Fails a PR if a library package imports something it does not declare.
#
# An undeclared peer is invisible locally — the app's own node_modules satisfies
# the import — and only breaks in a consumer's build. core-ui shipped 1.0.0 that
# way, importing @angular/forms without declaring it.
#
# The check is dependency-free node, so this job installs nothing: no npm ci, and
# no GitHub Packages auth needed to run it.

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  peer-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check declared peer dependencies
        run: node tools/check-peer-deps.mjs
